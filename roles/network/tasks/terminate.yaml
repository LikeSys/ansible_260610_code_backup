# terminate.yaml
# 삭제할 VPC 정보 조회
- name: VPC Info
  amazon.aws.ec2_vpc_net_info:
    filters:
      "tag:Name": "{{ prefix }}-vpc"
    region: "{{ region }}"
  register: vpc_info


- name: Set VPC ID
  set_fact:
    target_vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
  when:
    - vpc_info.vpcs | length > 0

# NAT 정보 조회
- name: NAT Gateway Info
  amazon.aws.ec2_vpc_nat_gateway_info:
    filters:
      "tag:Name": "{{ prefix }}-nat"
    region: "{{ region }}"
  register: nat_info

# NAT 삭제
- name: Terminate NAT Gateway
  amazon.aws.ec2_vpc_nat_gateway:
    region: "{{ region }}"
    nat_gateway_id: "{{ nat_info.result[0].nat_gateway_id }}"
    state: absent
    wait: true
    
  when:
    - nat_info is defined
    - nat_info.skipped is not defined
    - nat_info.result is defined
    - nat_info.result | length > 0

# EIP 정보 조회
- name: Elastic IP Info
  amazon.aws.ec2_eip_info:
    filters:
      "tag:Name": "{{ prefix }}-eip"
    region: "{{ region }}"
  register: eip_search_info

# EIP 릴리즈
- name: Terminate Elastic IP
  amazon.aws.ec2_eip:
    public_ip: "{{ eip_search_info.addresses[0].public_ip }}"
    region: "{{ region }}"
    state: absent
  when:
    - eip_search_info is defined
    - eip_search_info.addresses | length > 0

# public 라우터 삭제
- name: Terminate Route Table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-public-rt"
    state: absent
  when: target_vpc_id is defined

# private1 라우터 삭제
- name: Terminate Route Table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-private1-rt"
    state: absent
  when: target_vpc_id is defined

# private2 라우터 삭제
- name: Terminate Route Table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-private2-rt"
    state: absent
  when: target_vpc_id is defined

# IGW 삭제
- name: Terminate Internet Gateway
  amazon.aws.ec2_vpc_igw:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    state: absent
  when: target_vpc_id is defined

# 서브넷 삭제
- name: Terminate Subnets
  amazon.aws.ec2_vpc_subnet:
    vpc_id: "{{ target_vpc_id }}"
    cidr: "{{ item.value.cidr }}"
    az: "{{ item.value.az }}"
    region: "{{ region }}"
    state: absent
  loop: "{{ subnets | dict2items }}"
  when: target_vpc_id is defined

# VPC 삭제
- name: Terminate VPC and related resources
  amazon.aws.ec2_vpc_net:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-vpc"
    state: absent
  when: target_vpc_id is defined

