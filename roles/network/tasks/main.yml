---
# tasks file for network
# VPC 생성
- name: Create VPC
  amazon.aws.ec2_vpc_net:
    name: "{{ prefix }}-vpc"
    cidr_block: "{{ vpc_cidr }}"
    region: "{{ region }}"
    state: present
  register: vpc

# Subnet 생성
- name: Create Subnets
  amazon.aws.ec2_vpc_subnet:    
    vpc_id: "{{ vpc.vpc.id }}"
    cidr: "{{ item.value.cidr }}"
    az: "{{ item.value.az }}"
    region: "{{ region }}"
    map_public: "{{ 'subnet-public' in item.value.resource }}"
    tags:
      Name: "{{ prefix }}-{{ item.value.resource }}-{{ item.value.num }}"
    state: present
  loop: "{{ subnets | dict2items }}"
  register: subnets

# IGW 생성
- name: Create Internet Gateway
  amazon.aws.ec2_vpc_igw:
    vpc_id: "{{ vpc.vpc.id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-igw"
    state: present
  register: igw

# EIP 존재 여부 확인
- name: Check if Elastic IP exists
  amazon.aws.ec2_eip_info:
    filters:
      "tag:Name": "{{ prefix }}-eip"
    region: "{{ region }}"
  register: existing_eip

# EIP 생성
- name: Create Elastic IP
  amazon.aws.ec2_eip:
    region: "{{ region }}"
    release_on_disassociation: yes
    tags:
      Name: "{{ prefix }}-eip"
    state: present
  register: eip
  when:
    - existing_eip.addresses | length == 0

# 사용할 EIP 설정
- name: Set final Elastic IP Allocation ID fact
  set_fact:
    final_eip_alloc_id: "{{ eip.allocation_id if (existing_eip.addresses | length == 0) else existing_eip.addresses[0].allocation_id }}"
  when:
    - existing_eip.addresses is defined
    - existing_eip.addresses | length > 0

# NAT 생성
- name: Create NAT Gateway
  amazon.aws.ec2_vpc_nat_gateway:
    subnet_id: "{{ subnets.results | selectattr('item.value.resource', 'equalto', 'subnet-public') | map(attribute='subnet.id') | list | first }}"
    allocation_id: "{{ final_eip_alloc_id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-nat"
    state: present
    wait: yes
  register: nat

# Public 라우팅 테이블 생성
- name: Create Route Table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ vpc.vpc.id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-public-rt"
    routes:
      - dest: "0.0.0.0/0"
        gateway_id: "{{ igw.gateway_id }}"
    subnets: "{{ subnets.results | selectattr('item.value.resource', 'equalto', 'subnet-public') | map(attribute='subnet.id') | list }}"
    state: present

# Private1 라우팅 테이블 생성
- name: Create Route Table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ vpc.vpc.id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-private1-rt"
    routes:
      - dest: "0.0.0.0/0"
        gateway_id: "{{ nat.nat_gateway_id }}"
    subnets: "{{ subnets.results | selectattr('item.value.resource', 'equalto', 'subnet-private') | selectattr('item.value.num', 'equalto', '1') |map(attribute='subnet.id') | list }}"
    state: present

# Private2 라우팅 테이블 생성
- name: Create Route Table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ vpc.vpc.id }}"
    region: "{{ region }}"
    tags:
      Name: "{{ prefix }}-private2-rt"
    routes:
      - dest: "0.0.0.0/0"
        gateway_id: "{{ nat.nat_gateway_id }}"
    subnets: "{{ subnets.results | selectattr('item.value.resource', 'equalto', 'subnet-private') | selectattr('item.value.num', 'equalto', '2') |map(attribute='subnet.id') | list }}"
    state: present







