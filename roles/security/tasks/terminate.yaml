
# 삭제할 VPC 정보 조회
- name: VPC Info
  amazon.aws.ec2_vpc_net_info:
    filters:
      "tag:Name": "{{ prefix }}-vpc"
    region: "{{ region }}"
  register: vpc_info

- name: Set VPC ID
  set_fact:
    target_vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
  when:
    - vpc_info.vpcs | length > 0

# 2. 보안 그룹 삭제
- name: Terminate All Define Security Groups
  amazon.aws.ec2_security_group:
    name: "{{ item.value }}"
    vpc_id: "{{ target_vpc_id | default(omit) }}"
    region: "{{ region }}"
    state: absent
  loop: "{{ security_groups | dict2items }}"
  when: target_vpc_id is defined
