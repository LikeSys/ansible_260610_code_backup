---
# tasks file for security
# 1. VPC 정보 조회
- name: VPC Info
  amazon.aws.ec2_vpc_net_info:
    filters:
      "tag:Name": "{{ prefix }}-vpc"
    region: "{{ region }}"
  register: vpc_info

- name: Set VPC ID
  set_fact:
    target_vpc_id: "{{ vpc_info.vpcs[0].id }}"
  when: vpc_info.vpcs | length > 0

# 2. 보안 그룹 생성 - HTTP
- name: Create Security Group - HTTP
  amazon.aws.ec2_security_group:
    name: "{{ security_groups.http }}"
    description: "Security group for HTTP access"
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    rules:
      - proto: tcp
        from_port: 80
        to_port: 80
        cidr_ip: "0.0.0.0/0"
    tags:
      Name: "{{ security_groups.http }}"
    state: present
  
# 3. 보안 그룹 생성 - HTTPS
- name: Create Security Group - HTTPS
  amazon.aws.ec2_security_group:
    name: "{{ security_groups.https }}"
    description: "Security group for HTTPS access"
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    rules:
      - proto: tcp
        from_port: 443
        to_port: 443
        cidr_ip: "0.0.0.0/0"
    tags:
      Name: "{{ security_groups.https }}"
    state: present

# 4. 보안 그룹 생성 - SSH
- name: Create Security Group - SSH
  amazon.aws.ec2_security_group:
    name: "{{ security_groups.ssh }}"
    description: "Security group for SSH access"
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    rules:
      - proto: tcp
        from_port: 22
        to_port: 22
        cidr_ip: "0.0.0.0/0"
    tags:
      Name: "{{ security_groups.ssh }}"
    state: present
