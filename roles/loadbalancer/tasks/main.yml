---
# tasks file for loadbalancer
# 1. VPC 정보 조회
- name: VPC Info
  amazon.aws.ec2_vpc_net_info:
    filters:
      "tag:Name": "{{ prefix }}-vpc"
    region: "{{ region }}"
  register: vpc_info

- name: Set VPC ID
  set_fact:
    target_vpc_id: "{{ vpc_info.vpcs[0].id }}"
  when: vpc_info.vpcs | length > 0

# 2. 대상 그룹 생성
# 2-1. Jenkins 대상 그룹 
- name: Jenkins Target Group
  amazon.aws.ec2_target_group:
    name: "{{ alb_name.jenkins_tg }}"
    port: 80
    protocol: http
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    target_type: ip
    targets:
      - id: "{{ jenkins_ip }}"
        port: 80
    health_check_path: "/login"
    state: present
  register: jenkins_tg_info

# 3. 로드 밸런서 생성
- name: Jenkins Load Balancer
  amazon.aws.elb_load_balancer:
    name: "{{ alb_name.jenkins_alb }}"
    subnets: 
      - "{{ subnets.pub_1a.cidr }}"
      - "{{ subnets.pub_2c.cidr }}"
    security_groups:
      - "{{ security_groups.http }}"
      - "{{ security_groups.https }}"
    region: "{{ region }}"
    state: present
  register: jenkins_alb_info

# 4. 리스너 생성
- name: Jenkins Listener
  amazon.aws.elb_listener:
    load_balancer_arn: "{{ jenkins_alb_info.load_balancer.arn }}"
    port: 80
    protocol: HTTP
    region: "{{ region }}"
    default_actions:
      - type: forward
        target_group_arn: "{{ jenkins_tg_info.target_group.arn }}"
    state: present
  